[project]
name = "anki-george-german"
version = "0.1.0"
description = "German vocabulary Anki deck tools"
requires-python = ">=3.13"
dependencies = [
    "argcomplete>=3.0",
    "de-dep-news-trf @ https://github.com/explosion/spacy-models/releases/download/de_dep_news_trf-3.8.0/de_dep_news_trf-3.8.0.tar.gz",
    "rapidfuzz>=3.14.3",
    "requests>=2.32.5",
    "spacy[transformers]>=3.7",
    "charsplit @ git+https://github.com/dtuggener/CharSplit.git",
    "torch>=2.0",
    "spacy-transformers>=1.3",
    "pip>=26.0.1",
]

[project.scripts]
anki-german = "anki_george_german.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests requiring spaCy model load",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
